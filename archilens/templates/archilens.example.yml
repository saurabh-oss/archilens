# =============================================================================
# ArchiLens Configuration
# =============================================================================
# Written by `archilens init` for this repository. Everything active below works
# as is; the commented sections are examples to adapt. Every section is optional.

project:
  name: "{{project_name}}"
  description: ""
  # type: "library"  # monolith | microservices | modular-monolith | library

analysis:
  # Languages are detected from file extensions. Found here: {{languages}}.
  # List some to analyse only those:
  # languages: ["go"]

  # Entry points for process flow tracing (one AI request each). Leave this unset to
  # detect up to 5 from pyproject.toml scripts, package.json bin/main, and names such
  # as main.go, app.py and *Application.java. Setting it replaces the detection.
  # entry_points:
  #   - pattern: "**/*controller*.py"
  #     type: "http_handler"
  #   - pattern: "**/routes/**/*.ts"
  #     type: "http_handler"

  # Patterns to leave out, on top of what .gitignore already excludes. Patterns
  # without a leading **/ match at the repository root only.
  exclude:
{{exclude}}

  # Directory levels below a source root (src/, src/main/java, a go.mod dir, ...)
  # that name an L1 module. JS/TS workspace packages are always one module each.
  module_depth: 2

diagrams:
  output_dir: ".archilens/diagrams"
  format: "mermaid"  # mermaid | d2 | plantuml
  l1_max_edges: 40  # most dependencies drawn on L1, heaviest first; 0 draws all
  levels:
    - level: 0  # System Context: your system as a black box with external actors
      name: "System Context"
      enabled: true
    - level: 1  # Module Architecture: modules and the dependencies between them
      name: "Module Architecture"
      enabled: true
    - level: 2  # Component Detail: classes and functions inside each module
      name: "Component Detail"
      enabled: true
      modules: []  # module paths to drill into; all if empty
    - level: 3  # Process Flows: AI-inferred sequence diagrams from entry points
      name: "Process Flows"
      enabled: true
      max_flows: 10

# Business capabilities group modules into domains on the L1 diagram, and rules
# can refer to them by name. Modules found in this repository (by file count):
{{module_list}}
#
# capabilities:
#   - name: "Core"
#     description: "What these modules do for the business"
#     modules:
#       - "{{module_a}}/**"
#   - name: "Integrations"
#     modules:
#       - "{{module_b}}/**"

# External systems appear on the L0 diagram around your system. ArchiLens detects the common ones
# from third-party imports (databases, caches, queues, cloud storage, well-known APIs).
# {{detected_systems}}
# Declare a system here to describe it yourself, or to add one imports can't reveal. Set
# `detect_external_systems: false` under `analysis` to turn detection off.
# external_systems:
#   - name: "PostgreSQL"
#     type: "database"  # database | cache | queue | storage | external_api
#     description: "Primary data store"
#   - name: "Stripe API"
#     type: "external_api"
#     description: "Payment processing"

ai:
  provider: "anthropic"  # anthropic | openai | ollama | litellm
  model: "claude-opus-5-5"  # cheaper option for summaries: "claude-haiku-5-5"
  effort: "low"  # Claude 5-generation models: low | medium | high | xhigh | max
  cache: true  # reuse answers for unchanged input (~/.archilens/ai_cache.db)
  features:
    process_flow_inference: true  # sequence diagrams from entry points
    pattern_detection: true  # layered, hexagonal, event-driven, ...
    module_summaries: true  # one sentence per module

ci:
  # new (default): `archilens diff` fails only on violations a change introduces.
  # all: every violation of a "fail" rule fails.
  fail_on: "new"

  # Rules checked by `archilens check` and `archilens diff`.
  # `type`: forbidden-dependency | no-cycles | max-fan-out; `action`: warn | fail
  rules:
    - name: "acyclic-modules"
      type: "no-cycles"
      action: "warn"

    - name: "small-surface"
      type: "max-fan-out"
      threshold: 10
      action: "warn"

    # Keep one module from depending on another:
    # - name: "{{module_a_slug}}-independent-of-{{module_b_slug}}"
    #   type: "forbidden-dependency"
    #   from: "{{module_a}}/**"
    #   to: "{{module_b}}/**"
    #   action: "fail"

    # Or between capabilities (names from the capabilities section):
    # - name: "core-independent-of-integrations"
    #   type: "forbidden-dependency"
    #   from_capability: "Core"
    #   to_capability: "Integrations"
    #   action: "fail"

evolution:
  # Refs `archilens history` analyses, oldest first. Globs expand to matching tags
  # (in version order); the current HEAD is added at the end automatically.
  # Leave out to use all semver tags.
  # baseline_refs:
  #   - "tags/v*"
