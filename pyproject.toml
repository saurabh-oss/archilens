[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archilens"
version = "0.1.0"
description = "AI-powered layered architecture & process flow visualization for Git repositories"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Saurabh", email = "fosslectures@gmail.com" }
]
keywords = [
    "architecture", "diagrams", "github", "visualization",
    "mermaid", "code-analysis", "ai", "llm"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "networkx>=3.1",
    "anthropic>=0.39.0",
    "litellm>=1.40.0",
    "gitpython>=3.1.40",
    "jinja2>=3.1.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
    "mypy>=1.8",
    "pre-commit>=3.6",
]
viewer = [
    "flask>=3.0",
]

[project.scripts]
archilens = "archilens.cli:main"

[project.urls]
Homepage = "https://saurabh-oss.github.io/archilens/"
Repository = "https://github.com/saurabh-oss/archilens"
Issues = "https://github.com/saurabh-oss/archilens/issues"
Changelog = "https://github.com/saurabh-oss/archilens/releases"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]  # long prompt strings and HTML in viewer are intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
