# The GitHub Marketplace listing uses this file at the repository root
# (`uses: saurabh-oss/archilens@<version>`). An identical copy lives at
# github_action/action.yml for workflows written as
# `uses: saurabh-oss/archilens/github_action@<version>`; tests keep them identical.
name: "ArchiLens - Architecture Analysis"
description: "Architecture diagrams, a drift diff on every PR, and CI rules for module dependencies"
author: "saurabh-oss"
branding:
  icon: "layers"
  color: "blue"

inputs:
  repo-path:
    description: "Path to the repository to analyze"
    required: false
    default: "."
  install:
    description: >-
      What to pip-install: a version spec such as "archilens==0.17.0" to pin a release
      (recommended), or a local path such as "." to test ArchiLens's own checkout.
    required: false
    default: "archilens"
  enable-ai:
    description: >-
      Set to "true" to open the PR comment with an AI review: impact summary, points worth a
      look, new-module descriptions and flows of new entry points. One request per push, plus
      one per entry-point file the PR adds (at most two). Needs anthropic-api-key, billed to
      that key's account. Rule checks and fail-on-violations never use AI.
    required: false
    default: "false"
  ai-diagrams:
    description: >-
      With enable-ai, also set to "true" to add AI module summaries, process flows and
      patterns to the uploaded diagrams. About one request per module on every run.
    required: false
    default: "false"
  anthropic-api-key:
    description: "Anthropic API key for AI features"
    required: false
  comment-on-pr:
    description: "Post architecture diff as PR comment"
    required: false
    default: "true"
  fail-on-violations:
    description: "Fail the workflow if architecture rules with action 'fail' are violated"
    required: false
    default: "false"
  diagrams-output:
    description: "Output directory for generated diagrams"
    required: false
    default: ".archilens/diagrams"

outputs:
  diagrams-path:
    description: "Path to generated diagrams"
    value: ${{ inputs.diagrams-output }}
  has-changes:
    description: "Whether architecture changed from base (pull requests only)"
    value: ${{ steps.drift.outputs.has-changes }}
  violations-count:
    description: "Number of architecture rule violations (pull requests only)"
    value: ${{ steps.drift.outputs.violations-count }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install ArchiLens
      shell: bash
      env:
        ARCHILENS_INSTALL: ${{ inputs.install }}
        ENABLE_AI: ${{ inputs.enable-ai }}
      run: |
        pip install "$ARCHILENS_INSTALL"
        # AI needs the Anthropic SDK (the "ai" extra); install it alongside whatever spec was given.
        if [ "$ENABLE_AI" = "true" ]; then pip install "anthropic>=2.3.0,<3"; fi
        archilens --version

    # AI answers are cached by content, so a re-run, or a push that doesn't change what a
    # request contains, costs nothing. Every run saves its own entry (cache entries are
    # immutable) and the next run restores the newest one.
    - name: Restore the AI answer cache
      if: inputs.enable-ai == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.archilens/ai_cache.db
        key: archilens-ai-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: archilens-ai-${{ runner.os }}-

    - name: Run Architecture Analysis
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        archilens analyze \
          --repo "${{ inputs.repo-path }}" \
          --output "${{ inputs.diagrams-output }}" \
          ${{ (inputs.enable-ai != 'true' || inputs.ai-diagrams != 'true') && '--no-ai' || '' }} \
          --verbose

    - name: Architecture Drift Detection (PR)
      id: drift
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        report="$RUNNER_TEMP/arch-diff.md"
        rm -f "$report"

        # Exit code 1 with a report on disk means a rule with action 'fail' was
        # violated; that is handled by the last step so the PR comment still posts.
        status=0
        archilens diff \
          --repo "${{ inputs.repo-path }}" \
          --base "${{ github.event.pull_request.base.sha }}" \
          --head "${{ github.event.pull_request.head.sha }}" \
          ${{ inputs.enable-ai == 'true' && '--ai' || '' }} \
          --output "$report" > /dev/null || status=$?

        # No report means the diff itself could not run (unknown ref, bad config).
        if [ ! -f "$report" ]; then
          echo "::error::archilens diff failed (exit code $status). Make sure actions/checkout uses fetch-depth: 0 so the base commit is available."
          exit 1
        fi

        if grep -q '^### Changes' "$report"; then
          echo "has-changes=true" >> "$GITHUB_OUTPUT"
        else
          echo "has-changes=false" >> "$GITHUB_OUTPUT"
        fi
        echo "violations-count=$(grep -c '^- \[' "$report" || true)" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"

    - name: Comment on PR
      if: github.event_name == 'pull_request' && inputs.comment-on-pr == 'true'
      uses: actions/github-script@v9
      env:
        ARCHILENS_REPORT: ${{ steps.drift.outputs.report }}
      with:
        script: |
          const fs = require('fs');
          const diffContent = fs.readFileSync(process.env.ARCHILENS_REPORT, 'utf8');

          // Every report starts with this heading; it identifies our earlier comment
          // so the PR gets one comment that is updated, not one per push.
          const marker = '## ArchiLens: Architecture Diff';

          const body = diffContent || `${marker}\n\nNo architecture changes detected.`;

          try {
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(marker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
          } catch (error) {
            // PRs from forks get a read-only token, so commenting is refused (403).
            // The report is still in the job summary; don't fail the run over it.
            if (error.status === 403) {
              core.warning('ArchiLens could not comment on this PR (read-only token, e.g. a fork PR). The report is in the job summary.');
            } else {
              throw error;
            }
          }
          await core.summary.addRaw(body).write();

    - name: Upload Diagrams as Artifact
      uses: actions/upload-artifact@v7
      with:
        name: archilens-diagrams
        path: ${{ inputs.diagrams-output }}
        retention-days: 30

    - name: Fail on Rule Violations
      if: github.event_name == 'pull_request' && inputs.fail-on-violations == 'true' && steps.drift.outputs.exit-code != '0'
      shell: bash
      run: |
        echo "::error::ArchiLens found ${{ steps.drift.outputs.violations-count }} architecture rule violation(s), at least one with action 'fail'. See the PR comment or the diff step for details."
        exit 1
